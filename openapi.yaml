openapi: 3.1.0
info:
  title: Superserve API
  version: 0.1.0
  description: |
    Superserve provides sandbox infrastructure to run AI Agents in the cloud. Powered by Firecracker MicroVMs.

    ## Sandbox lifecycle

    ```
    starting --> active <--> idle --> deleted
    ```

    | Endpoint | What it does |
    |----------|-------------|
    | `POST /sandboxes` | Create a new sandbox |
    | `PATCH /sandboxes/:id` | Partially update a running sandbox (e.g. network rules) |
    | `POST /sandboxes/:id/pause` | Snapshot full state, suspend the VM |
    | `POST /sandboxes/:id/resume` | Restore from snapshot, continue where it left off |
    | `DELETE /sandboxes/:id` | Delete sandbox and all resources |

    ## Sandbox environment

    Each sandbox runs Ubuntu 24.04 with 1 vCPU, 1 GB RAM, 4 GB disk.
    Pre-installed: Python 3.12, Node.js 22, npm, git, curl, build-essential.
  contact:
    name: Superserve Team
  license:
    name: Proprietary

servers:
  - url: https://api-staging.superserve.ai
    description: Staging
  - url: https://api.superserve.ai
    description: Production
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      operationId: health
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: "0.1.0"

  /sandboxes:
    get:
      operationId: listSandboxes
      tags: [Sandboxes]
      summary: List all sandboxes
      description: Return the team's sandboxes, optionally filtered by metadata.
      parameters:
        - name: metadata.{key}
          in: query
          required: false
          schema:
            type: string
          description: Exact string-value metadata filter; repeat different keys to combine filters.
      security:
        - apiKey: []
      responses:
        "200":
          description: List of sandboxes belonging to the authenticated team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createSandbox
      tags: [Sandboxes]
      summary: Create a new sandbox
      description: |
        Creates a sandbox and returns immediately with `status: starting`.
        The VM boots asynchronously. Poll `GET /sandboxes/{id}` until
        `status` is `active` before running commands.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandbox_id}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"

    get:
      operationId: getSandbox
      tags: [Sandboxes]
      summary: Get a sandbox by ID
      security:
        - apiKey: []
      responses:
        "200":
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteSandbox
      tags: [Sandboxes]
      summary: Delete a sandbox
      security:
        - apiKey: []
      responses:
        "204":
          description: Sandbox deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: patchSandbox
      tags: [Sandboxes]
      summary: Partially update a running sandbox
      description: |
        Applies a partial update to a running sandbox. Each top-level field
        in the request body is optional; only fields that are present are
        applied. Omitted top-level fields are left unchanged. Nested objects
        are full replacements when present — to clear a list, send it as an
        empty array.

        At least one top-level field must be present, otherwise the request
        is rejected with `400`. Unknown top-level fields are also rejected
        with `400` so typos surface as errors instead of silent no-ops.

        ## Currently patchable fields

        - `network` — replaces the egress allow/deny rules. The sandbox
          must be in the `active` state; patching a paused or idle sandbox
          returns `409`. Rules take effect immediately and are persisted so
          they survive a future pause/resume cycle.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxPatch"
      responses:
        "204":
          description: Patch applied
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandbox_id}/pause:
    parameters:
      - $ref: "#/components/parameters/SandboxId"

    post:
      operationId: pauseSandbox
      tags: [Sandboxes]
      summary: Pause a running sandbox
      description: |
        Snapshots the sandbox's full state (memory + disk), suspends the VM,
        and transitions to `idle`. Resume it later to continue exactly where
        it left off.
      security:
        - apiKey: []
      responses:
        "200":
          description: Sandbox is now idle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandbox_id}/resume:
    parameters:
      - $ref: "#/components/parameters/SandboxId"

    post:
      operationId: resumeSandbox
      tags: [Sandboxes]
      summary: Resume a paused sandbox
      description: |
        Restores the sandbox from its paused snapshot. Transitions back to
        `active` with all state intact — same memory, same processes, same files.
      security:
        - apiKey: []
      responses:
        "200":
          description: Sandbox is now active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandbox_id}/exec:
    parameters:
      - $ref: "#/components/parameters/SandboxId"

    post:
      operationId: execCommand
      tags: [Exec]
      summary: Execute a command inside a sandbox
      description: |
        Runs a command inside the sandbox and waits for it to finish, returning
        stdout, stderr, and exit code. Idle sandboxes are automatically resumed
        before execution.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Command executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandbox_id}/exec/stream:
    parameters:
      - $ref: "#/components/parameters/SandboxId"

    post:
      operationId: execCommandStream
      tags: [Exec]
      summary: Execute a command and stream output via SSE
      description: |
        Runs a command and streams stdout/stderr chunks as Server-Sent Events.
        Each event is a JSON payload. The final event includes `exit_code` and
        `finished: true`. Idle sandboxes are automatically resumed before execution.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: >
            SSE stream. Each line starting with `data: ` contains a JSON
            `ExecStreamEvent`. The final event has `finished: true`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ExecStreamEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandbox_id}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: File path inside the sandbox (without leading slash).

    put:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a file into a sandbox
      description: Idle sandboxes are automatically resumed before the upload.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download a file from a sandbox
      description: Idle sandboxes are automatically resumed before the download.
      security:
        - apiKey: []
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandbox_id}/metrics:
    parameters:
      - $ref: "#/components/parameters/SandboxMetricsId"
    get:
      operationId: getSandboxMetrics
      tags: [Sandboxes]
      summary: Read cached sandbox resource measurements
      description: |
        Returns raw CPU, memory, and guest root filesystem measurements for a
        sandbox the caller may read. This authenticated JSON endpoint is separate
        from the operational Prometheus `/metrics` endpoint.

        Poll every 15–30 seconds and honor the existing API rate limits. Polling
        does not collect a new sample. Each resource has its own observation time;
        values may be stale or absent, including with older guest versions.
        Missing usage is `null`, never a fabricated zero. No utilization
        percentages are calculated.

        `source: live` means an observation came from the accepted current
        runtime's cache, not that it was freshly collected. `source: last_known`
        identifies a retained observation. Paused, failed, and other inactive
        states use only retained measurements without a live resource request.
        Measurements and persistence never delay sandbox lifecycle operations.

        Configured allocations and limits are current control-plane facts and
        are separate from observations. A resize does not recompute or retimestamp
        earlier usage. Effective CPU and memory allocations are returned only
        when confirmed for the live runtime; otherwise they are `null`.
      security:
        - apiKey: []
      responses:
        "200":
          description: Current allocations and independently timestamped observations
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    SandboxId:
      name: sandbox_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique identifier of the sandbox.

    SandboxMetricsId:
      name: sandbox_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicSandboxId"
      description: The unique identifier of the sandbox.

  schemas:
    CreateSandboxRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Human-readable name for the sandbox.
        from_snapshot:
          type: string
          format: uuid
          description: >
            If provided, boot the sandbox from this snapshot instead of
            creating a fresh VM. The snapshot must belong to the same team.
        network:
          $ref: "#/components/schemas/NetworkConfig"
        allow_internet_access:
          type: boolean
          description: Convenience toggle for outbound internet access. Explicit network rules take precedence.
        timeout_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 604800
          description: 'Optional auto-pause timeout in seconds. The sandbox is paused once its current active session has run this long; each resume starts a fresh window. When unset, the sandbox stays active until explicitly paused. Also settable later via `PATCH /sandboxes/{sandbox_id}`. Maximum 604800 (7 days).

            '
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Flat string-to-string tags attached to the sandbox at creation.\nUseful for grouping, owner labels, environment, run IDs, etc.\n\n## Constraints\n  - **Strings only.** Values must be strings. There is no type\n    coercion: `metadata.count=42` filters for the *string* \"42\".\n  - **At most 64 keys.**\n  - Each key may be at most **256 bytes**.\n  - Each value may be at most **2048 bytes** (2 KB).\n  - The serialized object may be at most **16384 bytes** (16 KB)\n    in total.\n  - Keys starting with `superserve.` or `_superserve` (case-\n    insensitive) are reserved for platform use and rejected.\n\nMetadata can be updated after creation via `PATCH /sandboxes/:id`.\nFilter sandboxes by metadata via the `metadata.{key}` query\nparameter on `GET /sandboxes`.\n"
          example:
            env: prod
            owner: agent-7

    SandboxResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [starting, active, pausing, idle, deleted]
        vcpu_count:
          type: integer
        memory_mib:
          type: integer
        ip_address:
          type: string
          description: IP address of the running VM (present when status is active).
        snapshot_id:
          type: string
          format: uuid
          description: ID of the latest snapshot (present after a pause).
        created_at:
          type: string
          format: date-time
        timeout_seconds:
          type: integer
          description: Optional hard lifetime cap in seconds from sandbox creation.
        network:
          $ref: '#/components/schemas/NetworkConfig'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: User-supplied string tags attached at creation.

    ExecStreamEvent:
      type: object
      description: A single SSE event payload emitted by the exec/stream endpoint.
      properties:
        timestamp:
          type: string
          format: date-time
        stdout:
          type: string
          description: Stdout chunk (present when the process wrote to stdout).
        stderr:
          type: string
          description: Stderr chunk (present when the process wrote to stderr).
        exit_code:
          type: integer
          description: Process exit code (present on the final event).
        finished:
          type: boolean
          description: True on the final event.
        error:
          type: string
          description: Error message if the exec itself failed (present on the final event on error).

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          description: Command to execute. Wrapped in `/bin/sh -c` unless `args` is provided.
        args:
          type: array
          items:
            type: string
          description: If provided, `command` is used as the binary and `args` as arguments (no shell wrapping).
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the command.
        working_dir:
          type: string
          description: Working directory (default /home/user).
        timeout_s:
          type: integer
          default: 30
          description: Timeout in seconds.

    ExecResult:
      type: object
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer

    NetworkConfig:
      type: object
      description: >
        Egress network rules for a sandbox. `allow_out` accepts CIDRs
        (e.g. `8.8.8.8/32`) and domain names (e.g. `api.openai.com`,
        `*.github.com`). `deny_out` accepts CIDRs only.
        Private ranges (10/8, 172.16/12, 192.168/16, 127/8, 169.254/16)
        are always blocked regardless of rules.
      properties:
        allow_out:
          type: array
          items:
            type: string
          description: CIDRs or domains to allow.
          example: ["api.openai.com", "*.github.com", "8.8.8.8/32"]
        deny_out:
          type: array
          items:
            type: string
          description: CIDRs to deny. Use `0.0.0.0/0` to block all traffic not in `allow_out`.
          example: ["0.0.0.0/0"]

    SandboxPatch:
      type: object
      description: |
        Partial update body for `PATCH /sandboxes/{sandbox_id}`. Each
        top-level field is optional; only fields that are present are
        applied. Omitted fields are left unchanged. Nested objects are
        full replacements when present — to clear a list, send it as an
        empty array.

        At least one top-level field must be set, otherwise the request
        is rejected with `400`. Unknown fields are also rejected with
        `400`.
      properties:
        network:
          allOf:
            - $ref: "#/components/schemas/NetworkConfig"
          description: |
            Replace the sandbox's egress rules. The sandbox must be in
            the `active` state. The provided `allow_out` and `deny_out`
            lists fully replace whatever was previously configured.
      example:
        network:
          allow_out: ["api.openai.com", "*.github.com"]
          deny_out: ["0.0.0.0/0"]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    PublicSandboxId:
      type: string
      pattern: '^(sb-[a-z0-9]+-)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: >
        Public sandbox ID: a bare UUID, or the region-tagged form
        `sb-<region>-<uuid>` (e.g. `sb-use-1b4e28ba-…`). Treat as an opaque
        string; the tagged form routes the request to the sandbox's home
        region. Endpoints accept both forms interchangeably.

    SandboxMetrics:
      type: object
      required:
      - id
      - status
      - cpu
      - memory
      - disk
      properties:
        id:
          $ref: '#/components/schemas/PublicSandboxId'
        status:
          type: string
          enum:
          - starting
          - active
          - pausing
          - paused
          - resuming
          - migrating
          - failed
        cpu:
          $ref: '#/components/schemas/SandboxCPUMetrics'
        memory:
          $ref: '#/components/schemas/SandboxMemoryMetrics'
        disk:
          $ref: '#/components/schemas/SandboxDiskMetrics'

    SandboxCPUMetrics:
      type: object
      required:
      - configured_vcpus
      - effective_vcpus
      - limit_vcpus
      - usage
      properties:
        configured_vcpus:
          type: number
          description: Configured vCPU allocation; the baseline when dynamic CPU is enabled.
        effective_vcpus:
          type:
          - number
          - 'null'
          description: Confirmed live runtime CPU allocation or quota in vCPUs; null when unknown or inactive.
        limit_vcpus:
          type: number
          description: Configured enforced vCPU ceiling; equals configured_vcpus for fixed CPU allocation.
        usage:
          type:
          - object
          - 'null'
          required:
          - used_vcpus
          - sampled_at
          - window_seconds
          - source
          properties:
            used_vcpus:
              type: number
              minimum: 0
              description: 'Average host-accounted CPU time consumed per elapsed second over the actual sample
                window, in vCPUs. The VM accounting group may include virtual machine monitor overhead. Not
                a percentage or cumulative counter, and not clamped to a later allocation.

                '
            sampled_at:
              type: string
              format: date-time
              description: Original observation window end, not the response time.
            window_seconds:
              type: number
              exclusiveMinimum: 0
              description: Actual elapsed CPU observation interval in seconds.
            source:
              $ref: '#/components/schemas/SandboxMeasurementSource'

    SandboxMemoryMetrics:
      type: object
      required:
      - configured_bytes
      - effective_bytes
      - limit_bytes
      - usage
      properties:
        configured_bytes:
          type: integer
          format: int64
          description: Configured initial memory allocation in bytes.
        effective_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Confirmed applied live memory allocation in bytes; null when unknown or inactive.
        limit_bytes:
          type: integer
          format: int64
          description: Enforced memory ceiling in bytes; equals configured_bytes for fixed memory.
        usage:
          type:
          - object
          - 'null'
          required:
          - used_bytes
          - sampled_at
          - source
          properties:
            used_bytes:
              type: integer
              format: int64
              minimum: 0
              description: 'Guest MemTotal minus MemAvailable from one observation, at MiB resolution converted
                to bytes. Reclaimable cache counted as available is excluded. This is not host process RSS
                or the configured memory allocation.

                '
            sampled_at:
              type: string
              format: date-time
              description: Original guest memory observation time.
            source:
              $ref: '#/components/schemas/SandboxMeasurementSource'

    SandboxDiskMetrics:
      type: object
      required:
      - configured_bytes
      - effective_bytes
      - limit_bytes
      - usage
      properties:
        configured_bytes:
          type: integer
          format: int64
          description: Configured logical disk size in bytes.
        effective_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Null when current applied disk geometry is not independently known. The observed root
            filesystem capacity is usage.total_bytes and has its own timestamp; it is not a current resize
            confirmation.

            '
        limit_bytes:
          type: integer
          format: int64
          description: Configured logical disk size limit in bytes.
        usage:
          type:
          - object
          - 'null'
          required:
          - total_bytes
          - used_bytes
          - available_bytes
          - sampled_at
          - source
          properties:
            total_bytes:
              type: integer
              format: int64
              minimum: 0
              description: Guest root filesystem capacity from statfs, in bytes.
            used_bytes:
              type: integer
              format: int64
              minimum: 0
              description: Total blocks minus free blocks, multiplied by block size.
            available_bytes:
              type: integer
              format: int64
              minimum: 0
              description: 'Blocks available to an unprivileged guest user, in bytes. Reserved blocks mean
                used_bytes plus available_bytes may differ from total_bytes. This is not host overlay or billed
                retained storage.

                '
            sampled_at:
              type: string
              format: date-time
              description: Original root filesystem observation time.
            source:
              $ref: '#/components/schemas/SandboxMeasurementSource'

    SandboxMeasurementSource:
      type: string
      enum:
      - live
      - last_known
      description: 'Observation provenance, not a freshness guarantee. live means the accepted current runtime''s
        cache; last_known means retained data. Always inspect the resource''s sampled_at timestamp.

        '

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Sandbox is not in a valid state for this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      headers:
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      description: Caller is authenticated but not allowed to perform the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: >
        A limit was hit. Usually the caller's request budget is temporarily
        exhausted: error code `rate_limited`, `Retry-After` present, and the
        bucket refills continuously.


        Some endpoints also return `429` for a limit of their own — too many
        invitations, snapshots, templates or sandboxes — which is a different
        thing entirely and may persist for much longer. Those carry no
        `Retry-After`, and `Retry-After` is the signal to key on: the
        `RateLimit-*` headers describe the request budget on every response,
        so on one of these they are present, accurate about the budget, and
        say nothing about the limit that actually refused the call. Do not
        read `RateLimit-Reset` as the wait for a `429` that has no
        `Retry-After`.
      headers:
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Retry-After:
          schema:
            type: integer
          description: >
            Seconds to wait before retrying. Present when the request budget
            refused the call, absent when an endpoint's own limit did.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  headers:
    RateLimitPolicy:
      description: >
        The budget that governs this request, as
        `"<scope>";q=<quota>;w=<seconds>;burst=<burst>`: which bucket it was
        charged against, how many requests that bucket sustains over the
        window, and the most that may be spent at once.


        Two buckets can refuse a request. Authenticated requests are
        normally charged against the per-team budget (`"team"`), but every
        request first passes a per-IP budget (`"ip"`) that blunts floods,
        and one refused there never reaches the team bucket. Read the scope
        rather than assuming which answered: behind a shared NAT or proxy it
        can be the IP budget even for a team well under its own limit.
      schema:
        type: string

    RateLimit:
      description: >
        What is left of the budget named by `RateLimit-Policy`, as
        `"<scope>";r=<remaining>;t=<seconds>`: `r` requests may be spent
        now, and `t` is the window that figure is good for.


        `t` is a pacing window, not a refill timer: spend no more than `r`
        within it, then read these headers again.


        `t` is the moment the bucket is full on any response these headers
        describe, with one exception: a `429` from the request budget
        itself, where `r` is zero and `t` is the wait for the single token
        you need, equal to `Retry-After`.


        A `429` from an endpoint's own limit — too many snapshots,
        templates, sandboxes — is not that case. It passed the request
        budget, so `r` is whatever was left, `t` is the ordinary full-refill
        wait, and no `Retry-After` is sent. Do not read these headers as the
        wait for that limit; they describe the request budget, which is not
        what refused the call.


        This and `RateLimit-Policy` are the current form of these headers.
        `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset` carry
        the same numbers in the earlier form and are still sent, so existing
        clients keep working; new clients should prefer these two.
      schema:
        type: string

    RateLimitLimit:
      description: >
        Bucket capacity, in the same unit as `RateLimit-Remaining`. This is
        the burst, not the per-second rate: the budget is a token bucket,
        not a fixed window, so the sustained rate is in `RateLimit-Policy`.


        Earlier form; `RateLimit-Policy` carries the same capacity as
        `burst`.
      schema:
        type: integer

    RateLimitRemaining:
      description: >
        Tokens left in the bucket after this request. Present on any
        response, so a client can read its budget before starting a batch.
      schema:
        type: integer

    RateLimitReset:
      description: >
        Seconds until the bucket is full again from where it stands. Not a
        window boundary; there is no window. Never below 1.


        This is not `Retry-After`. On a request-budget `429`, `Retry-After`
        is when one more request may be sent and this is when the whole
        budget is back; they differ by roughly the burst. Sleep on
        `Retry-After` to send the next request, on this to restart a batch.


        It is also not `t` in `RateLimit`, which is the shorter pacing
        window on a `429` that the request budget itself produced. This
        field is always the full-refill timer, whatever the response.


        It always describes the request budget, which is not always what
        refused a `429` — see the `429` response description.
      schema:
        type: integer
