# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../openapi.yaml
default-group: local
groups:
  local:
    generators:
      - name: fern-typescript-sdk
        version: 3.63.0
        output:
          location: local-file-system
          path: ../sdks/typescript
        config:
          namespaceExport: SuperserveApi
  python-sdk:
    generators:
      - name: fern-python-sdk
        version: 5.3.2
        output:
          location: local-file-system
          path: ../sdks/python
        config:
          client_class_name: SuperserveApi
          package_name: superserve
